# Congelado configuration
# Copy next to the built binary. All fields are optional — shown values are defaults.
#
# Every section under [plugins.*] is forwarded verbatim to the matching plugin's
# on_load() via CongeladoConfigView. The plugin itself defines which keys it reads.
# There is no special host-side schema — add whatever fields your plugin expects.

# ── Built-in protocol plugins ─────────────────────────────────────────────────
# [plugins.http2] configures the HTTP/2 listener.
# Integer fields (port, threads) are stored and forwarded as strings internally.

[plugins.http2]
type = "protocol"
host = "localhost"
port = 8080
threads = 4
cert = "server.crt"
key = "server.key"

# ── External plugins (loaded via dlopen) ──────────────────────────────────────
# Each section is matched to lib<name>.so in the same directory as the binary.
# Logger is just a plugin — add any fields your logger plugin needs here.

[plugins.file_logger]
type = "logger"
file = "congelado.log"
level = "debug"
stdout_level = "debug"

[plugins.engine]
type = "custom"
