name: ci-failure-issue

on:
  workflow_run:
    workflows: [ci, security, release]
    types: [completed]
    branches: [master]

permissions:
  actions: read
  issues: write

jobs:
  issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const label = 'ci-broken';
            const title = `CI broken on master: ${run.name}`;
            const { owner, repo } = context.repo;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'b60205', description: 'A workflow failed on master',
              });
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: label, state: 'open',
            });
            const existing = open.find((issue) => issue.title === title);

            if (run.conclusion === 'success') {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Green again: ${run.html_url} (${run.head_sha.slice(0, 7)})`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed',
                });
              }
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id,
            });
            const failed = jobs
              .filter((job) => job.conclusion === 'failure')
              .map((job) => `- [${job.name}](${job.html_url})`)
              .join('\n');
            const details = [
              `Run: ${run.html_url}`,
              `Commit: ${run.head_sha} by ${run.head_commit?.author?.name ?? 'unknown'}`,
              '',
              'Failed jobs:',
              failed || '- none reported',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: details });
            } else {
              await github.rest.issues.create({ owner, repo, title, labels: [label], body: details });
            }
