name: security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  secrets-and-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/ci-run
        with:
          target: ci-secrets ci-deps
          cache-key: security
          report-name: reports-security
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('reports/security/gitleaks.sarif') != ''
        with:
          sarif_file: reports/security/gitleaks.sarif
          category: gitleaks
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('reports/security/osv.sarif') != ''
        with:
          sarif_file: reports/security/osv.sarif
          category: osv-scanner

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-${{ matrix.language }}
