name: release

# Images are only built after the ci and security workflows both succeeded on the same commit: the release
# workflow starts when either of them finishes on master, and the gate job lets only the later of the two
# proceed once both are green. A version tag (v*) is released only if its commit already passed both.

on:
  workflow_run:
    workflows: [ci, security]
    types: [completed]
    branches: [master]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.check.outputs.sha }}
      short: ${{ steps.check.outputs.short }}
    steps:
      - id: check
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const trigger = context.payload.workflow_run;
            const sha = trigger ? trigger.head_sha : context.sha;
            core.setOutput('sha', sha);
            core.setOutput('short', sha.slice(0, 7));
            core.setOutput('ready', 'false');

            const latest = {};
            for (const file of ['ci.yml', 'security.yml']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: file, head_sha: sha, per_page: 20,
              });
              // newest run of that workflow on this commit that is not the autofix branch dispatch
              latest[file] = data.workflow_runs
                .filter((run) => run.head_branch === 'master' || context.eventName !== 'workflow_run')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            }

            for (const [file, run] of Object.entries(latest)) {
              if (!run) {
                core.warning(`${file}: no run on ${sha.slice(0, 7)}; not releasing`);
                if (context.eventName !== 'workflow_run') core.setFailed(`${file} never ran on ${sha}`);
                return;
              }
              if (run.status !== 'completed' || run.conclusion !== 'success') {
                core.warning(`${file}: ${run.status}/${run.conclusion}; not releasing`);
                if (context.eventName !== 'workflow_run') core.setFailed(`${file} is not green on ${sha}`);
                return;
              }
            }

            // Both green. When triggered by workflow_run only the later-finishing workflow releases.
            if (trigger) {
              const finished = Object.values(latest).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at))[0];
              if (finished.id !== trigger.id) {
                core.notice('The other workflow finished later and will release.');
                return;
              }
            }
            core.setOutput('ready', 'true');

  images:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        image: [builder, server, worker]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=master,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
            type=raw,value=sha-${{ needs.gate.outputs.short }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,scope=release-${{ matrix.image }},mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
