# Congelado engine configuration — the local/bare-metal congelado.toml, loaded directly by `make
# run`/`make debug` (main.cc's hardcoded config path is "~/cc/congelado/config/congelado.toml",
# see src/main.cc's own doc comment — that resolves to exactly this file when the repo lives at
# ~/cc/congelado). For the docker-compose stack, see config/docker/congelado.toml instead —
# docker/Dockerfile.server COPYs that one into the image at the same hardcoded path. The two
# files exist separately because the endpoints below differ: "localhost" here vs. docker-compose
# service names there — a bare-metal process isn't on that bridge network and can't resolve
# hostnames like "postgres"/"rabbitmq"/"tempo"/"loki". This file is meant to be paired with `make
# compose-env-up` (docker/docker-compose.environment.yml) — that stack publishes every backend
# below to a host port with nothing gated behind a profile, so an unmodified copy of this file
# connects to all of it as soon as that stack is up. Metrics/traces/logs still point at
# docker-compose.yml's separate observability stack instead (docker-compose.environment.yml has
# no otel services of its own) — see that section below for what to run for those. Every plugin
# below degrades gracefully on a failed connection (logs a warning, falls back to
# local-only/in-memory mode) if nothing is listening, so an unmodified copy of this file is still
# a safe default with nothing else running.

threads = 4

# Global, host-owned — scanned once after every plugin has loaded, not tied to any one plugin.
migrations_dir = "migrations"

[plugins.http2]
type = "protocol"
host = "0.0.0.0"
port = 8080
cert = "server.crt"
key = "server.key"

[plugins.file_logger]
type = "logger"
file = "congelado.log"
level = "debug"
stdout_level = "debug"

[plugins.engine]
type = "custom"

# Section key matches the plugin's stripped .so stem ("libpostgres_plugin.so" -> "postgres_plugin",
# see core/manager/shared_lib.cppm's scan()), not the plugin's own get_name() ("postgres"). Points
# at docker-compose.environment.yml's postgres service, which publishes :5432 to the host — up
# with `make compose-env-up`. Otherwise postgres_plugin just degrades gracefully (see file
# header).
[plugins.postgres_plugin]
type = "storage"
host = "localhost"
port = 5432
user = "congelado"
password = "congelado"
dbname = "congelado"
# postgres_plugin also implements ISearchProvider (see plugins/postgres/src/postgres_plugin.cc)
# — see the [providers] table at the bottom of this file for which capability picks which
# plugin.

# Metrics/traces/logs below point at the docker-compose observability stack's HOST-published
# ports (docker/docker-compose.yml) — prometheus:9090 and loki:3100 are published there, so these
# two work as soon as `docker compose -f docker/docker-compose.yml up prometheus loki` is running,
# no full stack needed. tempo's OTLP ports (4317/4318) are deliberately NOT published to the host
# by default (see that compose file's own comment on tempo) — reaching every endpoint below is now
# an unconditional hard requirement (no opt-out), so add a `ports:` mapping for tempo there too
# before booting against this config, or the server will fail to start on the unreachable
# traces_endpoint.
[plugins.otel_otlp_plugin]
type = "custom"
service_name = "congelado-server"
metrics_endpoint = "http://localhost:9090/api/v1/otlp/v1/metrics"
traces_endpoint = "http://localhost:4318/v1/traces"
logs_endpoint = "http://localhost:3100/otlp/v1/logs"

# Alternative ISearchProvider backend to postgres_plugin's own — config kept below so switching
# to it is a `[providers] search = "elasticsearch_plugin"` flip, not a config edit too. While
# postgres_plugin is the pick (default), this section is never even probed: discard_unlisted_
# provider_gated_plugins() (sdk/heart/app.cppm) discards a non-selected search-capable plugin
# before its on_load ever runs. If you DO select it, reaching docker-compose.environment.yml's
# elasticsearch service (`make compose-env-up`) becomes a hard boot requirement — elasticsearch_
# plugin's on_load probes it and throws if unreachable, same contract postgres_plugin has for
# its own connection.
[plugins.elasticsearch_plugin]
type = "search"
hosts = "http://localhost:9200"
index_prefix = "congelado_"

# Event-bus backends (interfaces::IEventSink) — memory_events_plugin has no [plugins.*] section
# of its own (nothing to configure beyond its `max_events` default). Config kept below so adding
# any of these to `[providers] events = [...]` is a one-line flip, not a config edit too — while
# unlisted there (default), none of them are even probed: discard_unlisted_provider_gated_
# plugins() discards a plugin not listed under its capability's provider entry before its
# on_load ever runs. Once listed, each points at docker-compose.environment.yml's matching
# service (`make compose-env-up`) and reaching it becomes a hard boot requirement — connect
# failure now throws instead of degrading (same contract postgres_plugin already has).
[plugins.rabbitmq_events_plugin]
type = "custom"
host = "localhost"
port = 5672
vhost = "/"
user = "admin"
password = "admin"
exchange = ""

[plugins.kafka_events_plugin]
type = "custom"
bootstrap_servers = "localhost:9092"
topic = "congelado-events"

[plugins.redis_events_plugin]
type = "custom"
host = "localhost"
port = 6379
channel_prefix = "congelado."
# redis_events_plugin also implements interfaces::ICache (see plugins/events/redis/src/
# redis_events_plugin.cc) — see the [providers] table at the bottom of this file for which
# capability picks which plugin. key_prefix is optional (default ""), prepended to every cache
# key so Connector's cache namespace can't collide with the pub/sub channel namespace above.
key_prefix = "congelado:cache:"

# Which plugin(s) get picked per capability, by stem (the [plugins.<stem>] section key above,
# not the plugin's own get_name()) — see sdk/heart/app.cppm's load_plugins() for exactly how
# each entry gets resolved. database/search only ever use the first name listed (single active
# backend); logger and events are genuine lists — their registries fan out to every one named,
# unlike database/search's "pick one" story.
[providers]
database = "postgres_plugin"
search = "postgres_plugin"
# search = "elasticsearch_plugin"
logger = ["file_logger"]
# memory_events_plugin is always active by default (zero external deps, nothing to opt into).
# Add rabbitmq/kafka/redis to this list to also publish onto those brokers once they're up
# locally; all three coexist just fine (events is a fan-out registry, same shape as logger, not
# a single-active-backend pick).
events = ["memory_events_plugin"]
# events = ["memory_events_plugin", "rabbitmq_events_plugin", "kafka_events_plugin", "redis_events_plugin"]
# Explicit, not left unset: cache is the one capability with two real candidate plugins
# (local_cache_plugin, redis_events_plugin) both always present in the scanned plugins
# directory regardless of this file's [plugins.*] sections — leaving this unset would let
# discard_unlisted_provider_gated_plugins() keep both eligible and hand plugin-scan order the
# tie-break (sdk/heart/app.cppm), which could silently pick redis and, since redis is now a
# hard boot requirement when selected, fail startup on an untouched default. Pin it. Swap to
# redis_events_plugin once it's up locally.
cache = "local_cache_plugin"
# cache = "redis_events_plugin"
