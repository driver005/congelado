# Congelado Worker Configuration

engine_host = "localhost"
engine_port = 8080
bind_host = "0.0.0.0"
bind_port = 8081
engine_cert = ""
engine_key = ""
worker_id = "worker-1"
concurrency = 4

[[tasks]]
name = "echo_task"
worker_type = "echo"

[[tasks]]
name = "transform_task"
worker_type = "transform"

# file_logger — a distinct filename from congelado.toml's ("worker.log" vs "congelado.log") so
# the server and worker never fight over the same file when both run from this same directory.
[plugins.file_logger]
type = "logger"
file = "worker.log"
level = "debug"
stdout_level = "debug"

# otel_otlp_plugin is optional, same as in congelado.toml — service_name distinguishes this
# process from the engine server in Grafana/Loki/Tempo (both share the same plugin .so).
[plugins.otel_otlp_plugin]
type = "custom"
service_name = "congelado-worker"
