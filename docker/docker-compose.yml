version: "3.8"

services:
  # ── Engine Server ──────────────────────────────────────────────────────────
  server:
    image: localhost/congelado-server:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: congelado-server
    # io_uring is this project's only I/O leverager backend (no epoll/posix fallback) —
    # container runtimes' default seccomp profiles commonly block the io_uring syscalls,
    # so the engine needs them explicitly allowed to start at all.
    security_opt:
      - seccomp:unconfined
    ports:
      - "8080:8080"
    networks:
      - congelado
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8080/api/v1/metadata/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── Worker ────────────────────────────────────────────────────────────────
  worker:
    image: localhost/congelado-worker:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: congelado-worker
    # Same io_uring seccomp requirement as the server — see the comment there.
    security_opt:
      - seccomp:unconfined
    depends_on:
      server:
        condition: service_healthy
    networks:
      - congelado

  # ── Integration Tests ─────────────────────────────────────────────────────
  test:
    image: localhost/congelado-test:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    container_name: congelado-test
    depends_on:
      server:
        condition: service_healthy
    environment:
      - ENGINE_HOST=server
      - ENGINE_PORT=8080
    networks:
      - congelado

networks:
  congelado:
    driver: bridge
