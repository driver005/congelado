version: "3.8"

services:
  # ── Engine Server ──────────────────────────────────────────────────────────
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: congelado-server
    ports:
      - "8080:8080"
    networks:
      - congelado
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8080/api/v1/metadata/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── Worker ────────────────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: congelado-worker
    depends_on:
      server:
        condition: service_healthy
    networks:
      - congelado

  # ── Integration Tests ─────────────────────────────────────────────────────
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    container_name: congelado-test
    depends_on:
      server:
        condition: service_healthy
    environment:
      - ENGINE_HOST=server
      - ENGINE_PORT=8080
    networks:
      - congelado

networks:
  congelado:
    driver: bridge
