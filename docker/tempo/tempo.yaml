# Single-node (monolithic) Tempo config for the docker-compose stack — local disk storage, OTLP
# gRPC+HTTP receivers on the standard Collector ports. Based on Tempo's own minimal monolithic
# reference config.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
