component: range-calendar
flutter_name: HeroRangeCalendar
status: complete

source:
  ref: "@heroui/styles@3.2.4 (npm), dist/components/range-calendar.css"
  files: [tool/sources/heroui-range-calendar.css]
  docs: https://heroui.com/en/docs/react/components/range-calendar

anatomy:
  - .range-calendar: w-63 max-w-63 (252) inline-size container
  - .range-calendar__header: flex items-center justify-between px-0.5 (2) pb-4 (16)
  - .range-calendar__heading: flex-1 text-sm (14) font-medium
  - .range-calendar__nav-button: size-6 (24) rounded-xl (12) text-accent-soft-foreground; hover bg-default; active scale(0.95); focus status-focused; disabled status-disabled
  - .range-calendar__nav-button-icon: size-4 (16)
  - .range-calendar__grid: 7-column grid, w-full
  - .range-calendar__header-cell: text-xs (12) font-medium text-muted, pb-2 (8)
  - .range-calendar__grid-body tr:first-child td: mt-1 (4)
  - .range-calendar__cell: relative z-1 mx-0 my-[2px] rounded-3xl (24); selected (in range, not outside): rounded-none bg-accent-soft; selection-start/end: z-2 with rounded-ss-3xl/es-3xl / rounded-se-3xl/ee-3xl; row-boundary track corners rounded-ss-lg/es-lg and rounded-se-lg/ee-lg (8); outside selected: bg-default/20
  - .range-calendar__cell-button: flex aspect-square w-full items-center justify-center rounded-3xl text-sm (14) font-medium text-foreground; scale 200ms ease-out; pressed scale 0.9; selection caps bg-accent text-accent-foreground (pressed bg-accent-hover); today bg-accent-soft text-accent-soft-foreground (hover bg-accent-soft-hover); hover (not selected) bg-default
  - .range-calendar__cell-indicator: bottom-1 (4) size-[3px] rounded-xs (2) bg-muted; bg-accent-foreground when selected

kinds:
  color: none
  default: -

sizes: none
default: -

states:
  - rest
  - hover (hover media only): button bg-default (not selected)
  - pressed: button scale 0.9 (200ms ease-out); caps bg-accent-hover
  - focus-visible: status-focused on the button
  - selected (in range): track bg-accent-soft rounded-none
  - selection-start / selection-end: button bg-accent text-accent-foreground; track 24px corners on the cap side
  - today: button bg-accent-soft text-accent-soft-foreground (hover bg-accent-soft-hover)
  - outside-month: text-muted opacity-50; in-range outside (not caps) bg-default/20
  - unavailable/disabled: status-disabled + line-through

tokens:
  role: [colorAccent, colorAccentForeground, colorAccentHover, colorAccentSoft, colorAccentSoftForeground, colorAccentSoftHover, colorDefault, colorMuted, colorForeground, colorFocus, doubleDisabledOpacity, radius3xl, radiusLg, space05, space2, space4, space6, typeSm, typeXs, weightMedium]
  component: [space05=2 (px-0.5/my-0.5), space2=8 (header-cell pb-2), space4=16 (header pb-4), space6=24 (nav button size-6), radius3xl=24 (cell/button), radiusLg=8 (track row-boundary corners), typeSm=14 (heading/cell), typeXs=12 (weekday), weightMedium=500]

non_token_measurements:
  - calendar width 252 (w-63)
  - day cell 36x36 = 252 / 7 columns; vertical cell margins 2px each (my-[2px]) -> row height 40
  - nav button 24x24, icon 16, radius 12 (rounded-xl)
  - track corner rounding 8 (rounded-lg) at week boundaries; 24 (rounded-3xl) at caps
  - button press scale 0.9 at 200ms --ease-out; track bg/border 100ms
  - outside-month in-range track at 20% default alpha (bg-default/20)

behavior:
  - embedded (non-overlay) range-selection month grid
  - header: prev/next ghost buttons navigate months; heading formats "July 2025"
  - 6-week grid; first tap sets the start, second tap (after start) completes the range; tapping before the current start restarts it
  - hovering with only a start chosen previews the track to the hovered day
  - the range track is a continuous accent-soft band; caps are accent circles; corners round at week boundaries
  - locale-aware weekday labels and first day of week (MaterialLocalizations)

approximations:
  - weekday labels/first-day-of-week come from MaterialLocalizations instead of react-aria's Intl locale data
  - RTL start/end corner swapping not implemented (LTR only)
  - cell-button scale animates the button; the track bg transitions at 100ms ease-out
  - focus ring drawn as an inline 2px accent border (status-focused is ring-offset-0)
