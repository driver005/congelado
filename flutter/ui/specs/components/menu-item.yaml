status: complete

source:
  ref: "@heroui/styles@3.2.4 (npm), dist/components/menu-item.css"
  files: [tool/sources/heroui-menu-item.css]
  docs: https://heroui.com/en/docs/react/components/menu-item
anatomy:
  - item (relative flex min-h-9 w-full items-center justify-start gap-3 rounded-2xl px-2 py-1.5 will-change-transform)
  - label (pointer-events-none select-none; danger variant text-danger)
  - description (text-xs text-muted text-wrap)
  - indicator (absolute start-2 size-4 text-muted; ps-7 when present; dot size-2 single / checkmark size-2.5 multiple)
  - submenu indicator (chevron size-3.5, end-2)

kinds: default | danger (label + indicator text-danger)

sizes: none (min-h-9 = 36)
default: -

states: rest | hover (bg-default) | pressed (scale 0.98) | focus-visible (status-focused) | selected (dot scaled in / checkmark) | disabled (status-disabled opacity 0.5)

tokens:
  role: [color.default, color.defaultForeground, color.danger, color.muted, color.transparent, color.foreground, double.disabledOpacity]
  component: [radius.2xl (16), weight.medium, type.sm, type.xs, space.2 (px-2), space.15 (py-1.5), space.3 (gap), space.2 (start-2)]
  type: [type.sm, type.xs]

non_token_measurements:
  - indicator sizes (dot 8, check 10, chevron 14) are literals
  - dot scale-70/opacity-0 hidden state approximated with AnimatedScale/AnimatedOpacity

behavior: action row with an optional selection indicator (dot for single, checkmark for multiple), tap via onPressed, focus ring; disabled fades.

approximations:
  - checkmark/dot drawn as Material icons (CSS uses SVGs)
  - pressed scale 0.98 via AnimatedScale 250ms ease-out-quart
