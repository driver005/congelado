status: complete

source:
  ref: "@heroui/styles@3.2.4 (npm), dist/components/list-box-item.css"
  files: [tool/sources/heroui-list-box-item.css]
  docs: https://heroui.com/en/docs/react/components/list-box-item
anatomy:
  - item (relative flex min-h-9 w-full items-center justify-start gap-3 rounded-2xl px-2 py-1.5)
  - label (pointer-events-none select-none; danger variant text-danger)
  - description (text-xs text-muted text-wrap select-none)
  - indicator (absolute end-2 size-4 text-default-foreground; checkmark size-2.5; pe-7 when present)

kinds: default | danger (label + indicator text-danger)

sizes: none (min-h-9 = 36)
default: -

states: rest | hover (bg-default) | pressed (scale 0.98) | focus-visible (status-focused) | selected (checkmark) | disabled (status-disabled opacity 0.5)

tokens:
  role: [color.default, color.defaultForeground, color.danger, color.transparent, color.muted, color.foreground, double.disabledOpacity]
  component: [radius.2xl (16), weight.medium, type.sm, type.xs, space.2 (px-2), space.15 (py-1.5), space.3 (gap), space.2 (end-2)]
  type: [type.sm, type.xs]

non_token_measurements:
  - min-height 36 and indicator/checkmark sizes (16/10) are literals
  - popover px-2.5 (10) override exposed as paddingX

behavior: selectable row: hover bg-default, tap via onPressed, focus ring; disabled fades to disabled-opacity.

approximations:
  - checkmark drawn as a Material icon (CSS uses an SVG check)
  - pressed scale 0.98 via AnimatedScale 250ms ease-out-quart
  - v3 CSS has no selected background — only the checkmark indicator (verified in list-box-item.css)
