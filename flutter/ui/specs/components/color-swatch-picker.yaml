component: color-swatch-picker
flutter_name: HeroColorSwatchPicker
status: complete

source:
  ref: "@heroui/styles@3.2.4 (npm), dist/components/color-swatch-picker.css"
  files: [tool/sources/heroui-color-swatch-picker.css]
  docs: https://heroui.com/en/docs/react/components/color-swatch-picker

anatomy:
  - .color-swatch-picker: flex flex-wrap items-center gap-2 (8); --stack: flex-col
  - .color-swatch-picker__item: relative flex size-8 (32) items-center justify-center rounded-2xl (16) border-2 border-transparent outline-none no-highlight; transition border-color 100ms ease-out, box-shadow 100ms ease-out; focus-visible status-focused; disabled status-disabled
  - item selected: border-color var(--color-swatch-current) + box-shadow var(--field-shadow); inner swatch scale 0.77
  - .color-swatch-picker__swatch: block size-full, border-radius inherit, transform 100ms ease-out, hover scale 1.1
  - .color-swatch-picker__indicator: absolute inset-0 z-10 flex center; check size-1/3 text-white (data-light-color -> black), transform scale(0) -> scale(1) 150ms ease-out
  - sizes: --xs size-4 (16, border 1, radius 8), --sm size-6 (24, border 2, radius 12), --md size-8 (32, border 2, radius 16), --lg size-9 (36, border 3, radius 24), --xl size-10 (40, border 3, radius 24)
  - --square: item rounded-xl (12; xs 6, sm 8), swatch rounded-lg (8; xs/sm 6)

kinds:
  color: none
  default: -

sizes: xs, sm, md, lg, xl
default: md (32), circle, grid

states:
  - rest
  - hover (swatch scale 1.1, @media hover only)
  - focus-visible (status-focused per item)
  - selected (border = swatch color + field shadow + swatch scale 0.77 + check indicator)
  - disabled

tokens:
  role: [colorFocus, shadowField, doubleDisabledOpacity]
  component: []

non_token_measurements:
  - gap 8 (gap-2)
  - item sides 32 (16 / 24 / 36 / 40), borders 2 (1 / 2 / 3 / 3), radii 16 (8 / 12 / 24 / 24)
  - square radii: item 12 (xs 6, sm 8), swatch 8 (xs/sm 6)
  - check icon size = 1/3 of the item, scale 0.77 / 1.1 / 0 -> 1
  - checkerboard 8px cells (payload)

behavior:
  - tap selects a color; selection ring + check indicator (white, or black on light colors via luminance)
  - per-item focus ring + keyboard activation (enter/space)
  - grid = wrapping row, stack = column

approximations:
  - checkerboard painted as 8px squares (repeating-conic-gradient approximated)
  - selected swatch radius quirk (rounded-md for sm) simplified to the item swatch radius
  - hover detection via MouseRegion (hover-capable devices)
