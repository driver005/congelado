include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - tool/**
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Token maps are top-level finals (Mix tokens override ==, so const maps
    # are a compile error); always specify types on those.
    always_declare_return_types: true
